name: CI Pipeline

# Run on pull requests and pushes to dev and main branches
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  # Backend Testing Job
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8
      
      - name: Lint with flake8
        working-directory: ./backend
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run backend tests
        working-directory: ./backend
        run: |
          # Run pytest if tests exist, otherwise skip
          if [ -d "tests" ] || ls *test*.py 1> /dev/null 2>&1; then
            pytest --verbose --cov=. --cov-report=term-missing
          else
            echo "No tests found, skipping pytest"
          fi

  # Frontend Testing Job
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Lint frontend code
        working-directory: ./frontend
        run: npm run build --if-present
      
      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test -- --coverage --watchAll=false
        env:
          CI: true

  # Build verification job (ensures everything compiles)
  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build frontend for production
        working-directory: ./frontend
        run: npm run build
      
      - name: Verify backend can start
        working-directory: ./backend
        run: |
          # Quick syntax check
          python -m py_compile main.py
          echo "✅ Backend syntax check passed"
      
      - name: Report success
        run: |
          echo "🎉 All builds completed successfully!"
          echo "✅ Backend tests passed"
          echo "✅ Frontend tests passed"
          echo "✅ Production build successful"

